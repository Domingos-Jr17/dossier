# Dossier's PostgreSQL on Fly.io, as an app of its own, at the version the
# project asks for (18). Reached only from your other Fly apps, at
# <name>.internal:5432. Step by step in MOCAMBIQUE.md.
# Change the name: it must be unique on Fly.
app = "dossier-db-CHANGE-ME"
primary_region = "jnb"

[build]
  image = "postgres:18-alpine"

[env]
  POSTGRES_USER = "dossier"
  POSTGRES_DB = "dossier"
  # The password is a secret: POSTGRES_PASSWORD, set with `fly secrets set`.

# Postgres 18 keeps its data in a versioned folder: mount the parent.
[mounts]
  source = "dossier_pg"
  destination = "/var/lib/postgresql"

# 256 MB is tight for PostgreSQL's defaults (shared_buffers alone is 128 MB):
# smaller buffers and few connections, enough for one person's Dossier.
[experimental]
  cmd = ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=128MB"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
